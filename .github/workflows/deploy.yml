# Builds the site with build.py and publishes it on GitHub Pages on every push to main, and daily at 00:10 IST.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 18 * * *'   # 00:10 IST daily, so dated blog posts go live on their day

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are two separate jobs (GitHub's own recommended setup).
  # With one job, the deploy step sometimes asked for the site package a moment
  # before GitHub had registered it and failed with "No artifacts named
  # github-pages were found" (24 Nov 2026, on drparul and implants). Separate jobs give it time.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
